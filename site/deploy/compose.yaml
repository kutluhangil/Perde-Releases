# Perde sitesi, macmini-server'da. Port açmaz; dışarıya yalnız Cloudflare Tunnel (perde-site → perde.kutluhangil.dev).
# Kurulum ve güncelleme: Perde reposunda script/site-deploy.sh
name: perde-site
services:
  site:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: perde-site:latest
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2026.11.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://site:8080
    env_file: tunnel.env
    depends_on: [site]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
