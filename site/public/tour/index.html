<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Perde</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="icon" href="/favicon.png">
<script src="films.js?v=e79742fb"></script>
<style>
/* Perde sitesinin canlı turu: uygulamanın penceresi (iframe içinde). Ana sayfa bölümleri postMessage ile yönetir.
   Kaynak: docs/mockups/03-son-hal.html prototipi; filmler public/tour/films.js (src/data/films.ts). */
@property --a1{syntax:'<color>';inherits:true;initial-value:#1b2233}
@property --a2{syntax:'<color>';inherits:true;initial-value:#0c0d14}
:root{
  --ink:#f5f5f7; --ink-2:rgba(235,235,245,.62); --ink-3:rgba(235,235,245,.34);
  --stage:#030305; --win:#0a0a0c; --elev:#1c1c1e; --elev-2:#2c2c2e; --hair:rgba(255,255,255,.09);
  --glass:rgba(38,38,44,.52); --glass-hi:rgba(255,255,255,.14);
  --live:#30d158;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;
  --f-cin:"Cinzel","Trajan Pro",Georgia,serif; --f-ant:"Anton",Impact,"Arial Narrow",sans-serif;
  --f-dms:"DM Serif Display",Georgia,serif; --f-syn:"Syne","Avenir Next",sans-serif; --f-ita:"Italiana","Didot",Georgia,serif; --f-brand:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --spring:cubic-bezier(.2,.8,.2,1); --ease:cubic-bezier(.28,.11,.32,1);
  --sbw:228px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:transparent;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:2px;border-radius:8px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.f{fill:currentColor;stroke:none}

/* ---------- window ---------- */
.win{position:relative;width:100%;height:100vh;border-radius:var(--win-r,16px);overflow:hidden;background:var(--win);
  transition:--a1 1.4s var(--ease),--a2 1.4s var(--ease);isolation:isolate}
.amb{position:absolute;inset:0;z-index:0;background:
  radial-gradient(110% 70% at 75% -10%,color-mix(in srgb,var(--a1) 34%,transparent),transparent 60%),
  radial-gradient(80% 60% at 0% 110%,color-mix(in srgb,var(--a2) 70%,transparent),transparent 65%),var(--win)}
.content{position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.content::-webkit-scrollbar{display:none}
.view{min-height:100%;animation:viewIn .5s var(--spring) both}
@keyframes viewIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.pad{padding-left:calc(var(--sbw) + 34px);padding-right:28px}
.edge{position:absolute;inset:0 0 auto 0;height:78px;z-index:3;pointer-events:none;opacity:0;transition:opacity .3s;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:linear-gradient(rgba(10,10,12,.55),transparent);
  -webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
.edge.on{opacity:1}

/* glass */
.glass{background:var(--glass);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.12),0 10px 40px -12px rgba(0,0,0,.6)}

/* sidebar */
.side{position:absolute;z-index:5;left:10px;top:10px;bottom:10px;width:var(--sbw);border-radius:20px;padding:16px 10px 12px;display:flex;flex-direction:column;gap:2px;transition:transform .45s var(--spring),opacity .3s}
.lights{display:flex;gap:8px;padding:0 6px 16px}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.search{display:flex;align-items:center;gap:8px;margin:0 2px 12px;padding:0 10px;height:32px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--ink-3)}
.search input{all:unset;flex:1;min-width:0;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search .ic{width:15px;height:15px}
.grp{font-size:11px;font-weight:600;color:var(--ink-3);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:0 10px;height:32px;border-radius:9px;font-size:13px;color:rgba(235,235,245,.86);transition:background .2s;text-align:left;width:100%}
.nav .ic{width:17px;height:17px;color:var(--ink-2)}
.nav em{margin-left:auto;font-style:normal;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:var(--glass-hi);color:#fff}.nav.on .ic{color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);margin-left:auto;box-shadow:0 0 8px var(--live)}
.side .sp{flex:1}
.disk{margin:6px 4px 4px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;gap:7px}
.disk b{font-size:12px;color:var(--ink-2);font-weight:600}
.meter{display:flex;height:4px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.08)}
.meter i:nth-child(1){width:71.3%;background:rgba(255,255,255,.75)}.meter i:nth-child(2){width:28.7%;background:rgba(255,255,255,.3)}

/* toolbar */
.bar{position:absolute;z-index:4;top:14px;left:calc(var(--sbw) + 24px);right:14px;height:38px;display:flex;align-items:center;gap:12px;pointer-events:none}
.bar > *{pointer-events:auto}
.circ{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:transform .2s var(--spring),opacity .3s}
.circ:active{transform:scale(.92)}
.bar .title{font-size:13px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s var(--spring)}
.bar .title.on{opacity:1;transform:none}
.bar .grow{flex:1;pointer-events:none}
.pill{height:38px;border-radius:999px;display:flex;align-items:center;padding:0 4px}
.pill button{width:34px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);transition:background .2s,color .2s}
.pill button:hover{background:rgba(255,255,255,.1);color:#fff}
#back{opacity:0;pointer-events:none;transform:translateX(-6px)}
#back.on{opacity:1;pointer-events:auto;transform:none}
#sbtoggle{display:none}

/* ---------- home ---------- */
.hero{position:relative;height:calc(var(--wh,720px)*.76);min-height:420px;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s var(--ease)}
.slide.on{opacity:1}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 9s linear}
.slide.on img{transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,rgba(6,6,8,.82) 0%,rgba(6,6,8,.5) 34%,transparent 62%),
  linear-gradient(0deg,var(--win) 0%,rgba(10,10,12,.6) 18%,transparent 48%)}
.hinfo{position:absolute;z-index:2;left:calc(var(--sbw) + 44px);bottom:64px;max-width:520px;display:flex;flex-direction:column;gap:14px}
.hinfo > *{animation:rise .7s var(--spring) both}
.hinfo > *:nth-child(2){animation-delay:.07s}.hinfo > *:nth-child(3){animation-delay:.13s}.hinfo > *:nth-child(4){animation-delay:.19s}.hinfo > *:nth-child(5){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyeb{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.logo{margin:0;color:#fff;line-height:.95;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.45)}
.logo.cin{font-family:var(--f-cin);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.logo.ant{font-family:var(--f-ant);text-transform:uppercase;letter-spacing:.01em}
.logo.dms{font-family:var(--f-dms);letter-spacing:-.01em}
.logo.syn{font-family:var(--f-syn);font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.logo.ita{font-family:var(--f-ita);text-transform:uppercase;letter-spacing:.16em}
.hinfo .logo{font-size:clamp(34px,5vw,64px)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-2)}
.meta .q{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.35);color:#fff}
.ov{margin:0;font-size:14px;line-height:1.5;color:rgba(235,235,245,.8);max-width:58ch;text-wrap:pretty}
.acts{display:flex;align-items:center;gap:10px}
.play{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 22px 0 18px;border-radius:999px;background:#fff;color:#000;font-size:14px;font-weight:600;transition:transform .2s var(--spring),opacity .2s}
.play:hover{transform:scale(1.03)}.play:active{transform:scale(.96);opacity:.85}
.play .ic{width:15px;height:15px}
.gbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .2s var(--spring),background .2s}
.gbtn:hover{transform:scale(1.06)}.gbtn:active{transform:scale(.92)}
.gbtn.on{background:rgba(255,255,255,.9);color:#000}
.dots{position:absolute;z-index:2;right:30px;bottom:30px;display:flex;gap:6px}
.dots button{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden;position:relative;transition:width .45s var(--spring)}
.dots button.on{width:34px}
.dots button.on::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:fillx var(--dur,8s) linear forwards}
.hero.paused .dots button.on::after{animation-play-state:paused}
@keyframes fillx{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.row{display:flex;flex-direction:column;gap:12px;margin-top:26px;position:relative}
.hero + .row{margin-top:-18px}
.rh{display:flex;align-items:baseline;gap:10px}
.rh h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.rh span{font-size:12px;color:var(--ink-3)}
.rail{display:flex;gap:16px;overflow-x:auto;overflow-y:visible;padding:8px 28px 18px calc(var(--sbw) + 34px);margin:-8px 0 -18px;scroll-snap-type:x mandatory;scroll-padding-left:calc(var(--sbw) + 34px);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail > *{scroll-snap-align:start}
.rnav{position:absolute;top:50%;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;opacity:0;transition:opacity .25s,transform .2s var(--spring)}
.row:hover .rnav{opacity:1}
.rnav.l{left:calc(var(--sbw) + 22px)}.rnav.r{right:14px}

/* poster card */
.pc{flex:0 0 148px;display:flex;flex-direction:column;gap:8px;text-align:left;perspective:700px}
.pimg{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:12px;overflow:hidden;background:var(--g,#222);transform-style:preserve-3d;
  transition:transform .5s var(--spring),box-shadow .5s var(--spring);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 8px 20px -10px rgba(0,0,0,.7)}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s}
.pimg img.ld{opacity:1}
.shine{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(160px circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.28),transparent 60%);mix-blend-mode:soft-light}
.pc:hover .pimg,.pc:focus-visible .pimg{box-shadow:0 0 0 .5px rgba(255,255,255,.2) inset,0 22px 40px -14px color-mix(in srgb,var(--c,#000) 70%,#000)}
.pc:hover .shine{opacity:1}
.chips{position:absolute;left:8px;bottom:8px;display:flex;gap:4px}
.chip{font-size:9px;font-weight:700;letter-spacing:.04em;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.42);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18)}
.seen{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#000}
.seen .ic{width:12px;height:12px;stroke-width:2.6}
.prog{position:absolute;left:8px;right:8px;bottom:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.prog i{display:block;height:100%;background:#fff}
.pt{font-size:13px;font-weight:600;line-height:1.25;color:rgba(245,245,247,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.py{font-size:12px;color:var(--ink-3);margin-top:-6px}

/* continue card */
.cc{flex:0 0 300px;display:flex;flex-direction:column;gap:8px;text-align:left}
.cimg{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:var(--g,#222);transition:transform .5s var(--spring)}
.cimg img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s,transform 1.2s var(--spring)}
.cimg img.ld{opacity:1}
.cc:hover .cimg{transform:translateY(-3px)}
.cc:hover .cimg img{transform:scale(1.05)}
.cimg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent 55%)}
.cplay{position:absolute;z-index:1;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .3s}
.cplay span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transform:scale(.85);transition:transform .4s var(--spring)}
.cc:hover .cplay{opacity:1}.cc:hover .cplay span{transform:none}
.cmeta{position:absolute;z-index:1;left:12px;right:12px;bottom:10px;display:flex;flex-direction:column;gap:7px}
.cmeta b{font-size:14px;font-weight:600}
.cmeta small{font-size:11px;color:rgba(235,235,245,.7)}
.cmeta .prog{position:static}

/* collection stack */
.stack{flex:0 0 260px;height:250px;position:relative;text-align:left}
.stack .sc{position:absolute;top:6px;width:132px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;box-shadow:0 14px 30px -12px rgba(0,0,0,.8);transition:transform .6s var(--spring);background:#222}
.stack .sc img{width:100%;height:100%;object-fit:cover}
.stack .sc:nth-child(1){left:0;transform:rotate(-6deg) translateY(10px);z-index:1}
.stack .sc:nth-child(2){left:58px;z-index:3}
.stack .sc:nth-child(3){left:116px;transform:rotate(6deg) translateY(10px);z-index:2}
.stack:hover .sc:nth-child(1){transform:rotate(-10deg) translate(-18px,4px)}
.stack:hover .sc:nth-child(3){transform:rotate(10deg) translate(18px,4px)}
.stack:hover .sc:nth-child(2){transform:translateY(-6px)}
.stack .sl{position:absolute;left:0;bottom:0;font-size:13px;font-weight:600}
.stack .sl small{display:block;font-size:12px;font-weight:400;color:var(--ink-3)}

.foot{margin:34px 0 30px;font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:10px}

/* ---------- grid view ---------- */
.ghead{padding-top:76px;display:flex;flex-direction:column;gap:16px}
.ghead h2{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em}
.ghead p{margin:-10px 0 0;font-size:13px;color:var(--ink-3)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:rgba(255,255,255,.07);position:relative}
.seg button{position:relative;z-index:1;font-size:12px;font-weight:500;padding:5px 14px;border-radius:7px;color:var(--ink-2);transition:color .25s}
.seg button.on{color:#fff}
.seg .thumb{position:absolute;z-index:0;top:2px;bottom:2px;border-radius:7px;background:rgba(255,255,255,.16);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .4s var(--spring),width .4s var(--spring)}
.tog{font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:background .25s,color .25s}
.tog.on{background:#fff;color:#000}
.tog .ic{width:13px;height:13px;stroke-width:2.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:26px 18px;padding-top:22px;padding-bottom:40px}
.grid .pc{flex:none;min-width:0}
.empty{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--ink-3);font-size:14px}

/* ---------- detail ---------- */
.dhero{position:relative;height:var(--wh,720px);min-height:480px}
.dbg{position:absolute;inset:0;overflow:hidden}
.dbg img{width:100%;height:100%;object-fit:cover;animation:kb 24s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.0)}}
.dhero::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,rgba(6,6,8,.86) 0%,rgba(6,6,8,.45) 38%,transparent 66%),
  linear-gradient(0deg,var(--win) 1%,rgba(10,10,12,.55) 26%,transparent 55%)}
.dinfo{position:absolute;z-index:2;left:calc(var(--sbw) + 44px);right:30px;bottom:44px;display:flex;flex-direction:column;gap:14px;max-width:640px}
.dinfo > *{animation:rise .7s var(--spring) both}
.dinfo > *:nth-child(2){animation-delay:.08s}.dinfo > *:nth-child(3){animation-delay:.14s}.dinfo > *:nth-child(4){animation-delay:.2s}.dinfo > *:nth-child(5){animation-delay:.26s}
.dinfo .logo{font-size:clamp(36px,5.4vw,72px)}
.who{font-size:12px;color:var(--ink-3)}
.who b{color:var(--ink-2);font-weight:500}
.dsec{display:flex;flex-direction:column;gap:14px;margin-top:30px}
.dsec h3{margin:0;font-size:17px;font-weight:700}
.cast{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cast::-webkit-scrollbar{display:none}
.person{flex:0 0 86px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:600;color:rgba(255,255,255,.92);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2),0 8px 18px -8px rgba(0,0,0,.6);transition:transform .4s var(--spring)}
.person:hover .av{transform:scale(1.06)}
.person b{font-size:12px;font-weight:600;line-height:1.25}
.person small{font-size:11px;color:var(--ink-3);margin-top:-6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{border-radius:18px;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h4{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.srow{display:flex;align-items:center;gap:12px;min-height:34px;font-size:13px}
.srow + .srow{border-top:.5px solid var(--hair);padding-top:10px}
.srow .lang{font-weight:600}.srow small{color:var(--ink-3)}
.srow .r{margin-left:auto}
.fetch{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 14px;border-radius:999px;background:#fff;color:#000;font-size:12px;font-weight:600;transition:background .3s,color .3s,width .4s var(--spring)}
.fetch.busy{background:rgba(255,255,255,.12);color:#fff}
.fetch.done{background:rgba(48,209,88,.16);color:var(--live)}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.tech{display:flex;flex-wrap:wrap;gap:8px}
.tech span{font-size:12px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.06);color:var(--ink-2);font-variant-numeric:tabular-nums}
.fname{font:11px ui-monospace,Menlo,monospace;color:var(--ink-3);overflow-wrap:anywhere}

/* ---------- player ---------- */
.player{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden;transform-origin:bottom right;
  transition:transform .6s var(--spring),border-radius .6s var(--spring),box-shadow .6s;animation:pIn .55s var(--spring) both}
@keyframes pIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.player.pip{transform:translate(-18px,-18px) scale(.3);border-radius:46px;box-shadow:0 0 0 1.5px rgba(255,255,255,.2),0 40px 80px rgba(0,0,0,.8)}
.player.pip .pui{opacity:0;pointer-events:none}
.player canvas{position:absolute;inset:0;width:100%;height:100%}
.pui{position:absolute;inset:0;transition:opacity .45s var(--ease)}
.player.idle{cursor:none}
.player.idle .pui{opacity:0}
.ptop{position:absolute;top:16px;left:16px;right:16px;display:flex;align-items:center;gap:12px}
.ptop b{font-size:14px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.ptop small{font-size:12px;color:var(--ink-2)}
.ptop .grow{flex:1}
.sub{position:absolute;left:50%;transform:translateX(-50%);bottom:122px;width:86%;text-align:center;font-weight:600;color:#fff;line-height:1.3;transition:bottom .45s var(--ease),opacity .3s;pointer-events:none}
.player.idle .sub{bottom:46px}
.sub span{display:inline;padding:2px 8px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub.s{font-size:18px}.sub.m{font-size:24px}.sub.l{font-size:31px}
.sub.shadow span{text-shadow:0 0 3px #000,0 2px 10px rgba(0,0,0,.9)}
.sub.box span{background:rgba(0,0,0,.6)}
.ctrl{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(820px,calc(100% - 32px));border-radius:24px;padding:12px 16px 10px;display:flex;flex-direction:column;gap:8px}
.scrub{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track{position:relative;flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18);transition:height .2s var(--spring)}
.scrub:hover .track{height:8px}
.track .buf{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.22);border-radius:3px}
.track .fill{position:absolute;inset:0 auto 0 0;background:#fff;border-radius:3px}
.track .ch{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.55)}
.knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%) scale(0);transition:transform .25s var(--spring);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.scrub:hover .knob,.scrub.drag .knob{transform:translate(-50%,-50%) scale(1)}
.prev{position:absolute;bottom:28px;width:176px;transform:translateX(-50%) translateY(6px);opacity:0;pointer-events:none;transition:opacity .2s,transform .3s var(--spring);display:flex;flex-direction:column;align-items:center;gap:6px}
.scrub:hover .prev{opacity:1;transform:translateX(-50%)}
.prev canvas{position:static;width:176px;height:99px;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.6)}
.prev span{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.6)}
.crow{display:flex;align-items:center;gap:2px}
.crow .t{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:48px}
.crow .t.r{text-align:right}
.cb{height:36px;min-width:36px;padding:0 9px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:12px;font-weight:600;transition:background .2s,transform .2s var(--spring)}
.cb:hover,.cb.on{background:rgba(255,255,255,.14)}
.cb:active{transform:scale(.92)}
.cb.big .ic{width:24px;height:24px}
.crow .mid{flex:1;display:flex;justify-content:center;gap:6px}
.hud{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.8);width:84px;height:84px;border-radius:50%;display:grid;place-items:center;opacity:0;pointer-events:none;font-size:13px;font-weight:700}
.hud.go{animation:hud .7s var(--spring)}
@keyframes hud{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}
.hud .ic{width:30px;height:30px}
.pop{position:absolute;bottom:118px;width:280px;max-width:calc(100% - 24px);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:13px;transform-origin:bottom center;animation:popIn .35s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
.pop h6{margin:8px 8px 4px;font-size:11px;font-weight:600;color:var(--ink-3)}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-align:left;width:100%}
.opt:hover{background:rgba(255,255,255,.08)}
.opt .ck{width:16px;color:#fff;opacity:0}.opt.on .ck{opacity:1}
.opt small{margin-left:auto;color:var(--ink-3);font-size:12px}
.step{display:flex;align-items:center;justify-content:space-between;padding:4px 6px}
.step b{font-variant-numeric:tabular-nums;font-size:13px}
.step button{width:30px;height:28px;border-radius:9px;background:rgba(255,255,255,.1);font-size:16px}
.pop .seg{margin:2px 6px 6px;display:flex}.pop .seg button{flex:1}

/* ---------- onboarding ---------- */
.onb{position:absolute;inset:0;z-index:30;background:#020203;display:grid;place-items:center;overflow:hidden;transition:opacity .7s var(--ease),transform .8s var(--spring)}
.onb.out{opacity:0;transform:scale(1.06);pointer-events:none}
.beam{position:absolute;left:50%;top:-30%;width:150%;height:130%;transform:translateX(-50%);pointer-events:none;
  background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(255,214,160,.11) 176deg,rgba(255,230,190,.2) 180deg,rgba(255,214,160,.11) 184deg,transparent 200deg);
  filter:blur(18px);animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateX(-50%) rotate(-7deg)}to{transform:translateX(-50%) rotate(7deg)}}
.wall{position:absolute;inset:-20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;padding:20px;opacity:.5;transform:rotate(-8deg) scale(1.15);pointer-events:none}
.wall div{aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#111;filter:blur(10px) grayscale(1) brightness(.25);transition:filter 1.2s var(--ease)}
.wall div img{width:100%;height:100%;object-fit:cover}
.wall div.dev{filter:none}
.ocard{position:relative;z-index:2;width:min(460px,calc(100% - 32px));display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:34px 28px;border-radius:30px}
.ocard .appicon{width:88px;height:88px;border-radius:21px;animation:iconIn 1s var(--spring) both}
@keyframes iconIn{from{opacity:0;transform:scale(.6) translateY(10px)}to{opacity:1;transform:none}}
.ocard h2{margin:0;font-family:var(--f-brand);font-weight:400;font-size:44px;letter-spacing:.16em;animation:rise .8s .15s var(--spring) both}
.ocard p{margin:-6px 0 0;color:var(--ink-2);font-size:14px;animation:rise .8s .25s var(--spring) both}
.drop{width:100%;border-radius:20px;padding:22px 18px;border:1px dashed rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;gap:10px;transition:background .3s,border-color .3s;animation:rise .8s .35s var(--spring) both}
.drop:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.4)}
.drop .ic{width:30px;height:30px;color:var(--ink-2);stroke-width:1.4}
.drop b{font-size:14px;font-weight:600}.drop small{font-size:12px;color:var(--ink-3)}
.path{font:12px ui-monospace,Menlo,monospace;color:var(--ink-2);padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.06)}
.scan{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.ring{width:96px;height:96px}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:#fff;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .25s linear}
.scan b{font-size:15px;font-variant-numeric:tabular-nums}
.scan small{font-size:12px;color:var(--ink-3);min-height:16px}

/* ---------- settings sheet ---------- */
.dim{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.45);display:grid;place-items:center;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.sheet{width:min(600px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;border-radius:26px;background:rgba(30,30,34,.86);backdrop-filter:blur(40px) saturate(170%);-webkit-backdrop-filter:blur(40px) saturate(170%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),0 40px 100px rgba(0,0,0,.7);animation:sheetIn .5s var(--spring) both;scrollbar-width:none}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.shead{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:12px;padding:16px 18px;background:rgba(30,30,34,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.shead h3{margin:0;font-size:15px;font-weight:700;flex:1;text-align:center}
.done{height:30px;padding:0 16px;border-radius:999px;background:#fff;color:#000;font-size:13px;font-weight:600}
.sbody{padding:4px 18px 22px;display:flex;flex-direction:column;gap:18px}
.gl h5{margin:0 0 6px 12px;font-size:11px;font-weight:600;color:var(--ink-3)}
.gl .box{border-radius:14px;background:rgba(255,255,255,.06);overflow:hidden}
.gr{display:flex;align-items:center;gap:12px;min-height:44px;padding:9px 14px;font-size:13px}
.gr + .gr{border-top:.5px solid var(--hair)}
.gr .sq{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.gr .sq .ic{width:15px;height:15px}
.gr .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.gr .tx small{font-size:11px;color:var(--ink-3)}
.gr .val{margin-left:auto;color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:6px;flex:none}
.sw{margin-left:auto;width:42px;height:26px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .3s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s var(--spring)}
.sw.on{background:var(--live)}.sw.on::after{transform:translateX(16px)}
.free{font-size:12px;color:var(--ink-3);text-align:center}

/* toast */
.toast{position:absolute;z-index:50;left:50%;top:16px;transform:translate(-50%,-20px);opacity:0;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;pointer-events:none;transition:opacity .3s,transform .45s var(--spring)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.flip{position:absolute;z-index:2;object-fit:cover;pointer-events:none}

/* ---------- liquid glass (SVG kırılma) ---------- */
.circ,.gbtn,.pill,.cplay span{position:relative}
.lg .glass{background:rgba(40,40,48,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 0 .5px rgba(255,255,255,.22),inset 2px 2px 1px -2px rgba(255,255,255,.6),inset -2px -2px 1px -2px rgba(255,255,255,.32),0 14px 40px -14px rgba(0,0,0,.7)}
.lg .side.glass{background:rgba(30,30,36,.26)}
.lg .pop.glass,.lg .ocard.glass,.lg .toast.glass{background:rgba(30,30,36,.32)}
.lg .glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(140deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 72%,rgba(255,255,255,.08) 100%)}

/* ---------- açılış: perde ---------- */
.intro{position:absolute;inset:0;z-index:60;background:#000;overflow:hidden;cursor:pointer;transition:opacity .9s var(--ease),transform 1.1s var(--spring)}
.intro.out{opacity:0;transform:scale(1.04);pointer-events:none}
.intro canvas{position:absolute;inset:0;width:100%;height:100%}
.iword{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:min(680px,92%);pointer-events:none}
.iword h2{margin:0;font-family:var(--f-brand);font-weight:400;font-size:clamp(54px,10vw,128px);letter-spacing:.5em;padding-left:.5em;line-height:1;white-space:nowrap;background:linear-gradient(180deg,#fff 25%,#a7a7b0);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}
.ilines{position:relative;width:100%;height:8px;margin-top:20px}
.ilines i{position:absolute;top:0;height:1px;left:12.5%;width:75%;transform:scaleX(0);background:linear-gradient(90deg,transparent,rgba(255,224,178,.95),transparent)}
.ilines i:nth-child(2){height:2px;filter:blur(2px)}
.ilines i:nth-child(3){left:37.5%;width:25%;background:linear-gradient(90deg,transparent,#fff,transparent)}
.ilines i:nth-child(4){left:37.5%;width:25%;height:5px;filter:blur(3px);background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent)}
.iword p{margin:150px 0 0;font-size:14px;letter-spacing:.08em;color:var(--ink-2);opacity:0}

/* ---------- dosyalar: cam klasörler ---------- */
.fgrid{display:flex;flex-wrap:wrap;gap:110px 44px;padding-top:110px;padding-bottom:60px}
.gf{--gf-px:0;--gf-py:0;--gf-ease:cubic-bezier(.2,.8,.2,1);--gf-spring:cubic-bezier(.34,1.36,.5,1);--gf-hinge:0deg;--gf-lift:42px;--gf-spread:0px;--gf-fan:0deg;--gf-stack:15px;position:relative;flex:none;isolation:isolate;color:#f5f5f7}
.gf:hover,.gf:focus-within{--gf-hinge:-11deg;--gf-lift:-34px;--gf-spread:8px;--gf-fan:1.4deg;--gf-stack:10px}
.gf[data-open]{--gf-hinge:-24deg;--gf-lift:-96px;--gf-spread:40px;--gf-fan:5deg;--gf-stack:30px;z-index:3}
.gf-stage{position:absolute;left:0;top:0;width:340px;height:272px;transform-origin:0 0}
.gf-tilt{position:absolute;inset:0;transform:perspective(1400px) rotateX(calc(var(--gf-py)*-3deg)) rotateY(calc(var(--gf-px)*4deg));transition:transform .9s var(--gf-ease)}
.gf-shadow{position:absolute;left:18px;right:18px;bottom:-6px;height:60px;border-radius:40px;background:rgba(0,0,0,.62);filter:blur(22px);transform:translateX(calc(var(--gf-px)*-8px));transition:transform .9s var(--gf-ease),opacity .9s var(--gf-ease)}
.gf-back{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#2a2a2e,#121214);transition:translate 1s var(--gf-ease),opacity .9s var(--gf-ease)}
.gf-art{position:absolute;left:-12px;top:-12px;width:364px;height:296px;max-width:none;object-fit:cover;transform:translate(calc(var(--gf-px)*-7px),calc(var(--gf-py)*-6px)) scale(1.02);transition:transform 1.1s var(--gf-ease)}
.gf-sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 22%),radial-gradient(120% 80% at 80% 0%,rgba(255,255,255,.12),transparent 60%)}
.gf-rim{position:absolute;left:0;top:0;max-width:none;overflow:visible;pointer-events:none;fill:none}
.gf-rim.b{width:340px;height:272px;transition:translate 1s var(--gf-ease),opacity .9s var(--gf-ease)}
.gf-rim.b path{stroke:rgba(255,255,255,.16);stroke-width:1}
.gf-files{position:absolute;inset:0;z-index:5;pointer-events:none;clip-path:inset(-400px -400px 10px -400px)}
.gf-sheet{position:absolute;left:34px;top:96px;width:272px;height:184px;border-radius:16px;overflow:hidden;cursor:pointer;pointer-events:auto;text-align:left;background:linear-gradient(180deg,#2c2c30,#1c1c1f);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 .5px rgba(255,255,255,.08),0 12px 28px -8px rgba(0,0,0,.7);transform-origin:50% 100%;
  transform:translate(calc(var(--gf-jx) + var(--gf-slot)*var(--gf-spread)),calc(var(--gf-lift) + var(--gf-depth)*var(--gf-stack)*-1)) rotate(calc(var(--gf-jr) + var(--gf-slot)*var(--gf-fan)));
  transition:transform .75s var(--gf-spring) calc(var(--gf-depth)*40ms),box-shadow .4s var(--gf-ease),translate .9s var(--gf-ease),opacity .9s var(--gf-ease)}
.gf[data-open] .gf-sheet:hover,.gf[data-open] .gf-sheet:focus-visible{transform:translate(calc(var(--gf-jx) + var(--gf-slot)*var(--gf-spread)),calc(var(--gf-lift) + var(--gf-depth)*var(--gf-stack)*-1 - 18px)) rotate(calc(var(--gf-slot)*var(--gf-fan)*.6));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 22px 40px -12px rgba(0,0,0,.85);transition-delay:0s}
.gf-sheet img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gf-sheet.art::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 40%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);pointer-events:none}
.gf-head{position:absolute;left:14px;right:14px;top:11px;z-index:1;display:flex;align-items:baseline;justify-content:space-between;gap:10px;white-space:nowrap}
.gf-name{overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:600;color:#fafafa}
.gf-fmeta{flex:none;font:10px ui-monospace,Menlo,monospace;color:rgba(250,250,250,.66)}
.gf-lines{position:absolute;left:14px;right:14px;top:40px;display:flex;flex-direction:column;gap:9px}
.gf-lines i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.08)}
.gf-lines i:first-child{height:9px;margin-bottom:4px;background:rgba(255,255,255,.16)}
.gf-front{position:absolute;left:0;top:74px;width:340px;height:198px;z-index:10;backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);transform-origin:50% 100%;transform:perspective(760px) rotateX(var(--gf-hinge));transition:transform .8s var(--gf-spring),translate 1s var(--gf-ease),opacity 1s var(--gf-ease)}
.gf-tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,18,20,.18),rgba(14,14,16,.62) 46%,rgba(8,8,10,.94))}
.gf-spec{position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px 200px at calc(50% + var(--gf-px)*46%) calc(30% + var(--gf-py)*40%),rgba(255,255,255,.5),transparent 70%);mix-blend-mode:screen;opacity:.16}
.gf-rim.f{width:340px;height:198px;opacity:.55}
.gf-rim.f path{stroke-width:2.4}
.gf-hit{position:absolute;inset:0;z-index:1;cursor:pointer}
.gf-label{position:absolute;z-index:2;left:28px;bottom:32px;display:flex;flex-direction:column;gap:4px;max-width:220px;pointer-events:none}
.gf-title{font-size:18px;font-weight:500;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf-meta{font:12px ui-monospace,Menlo,monospace;letter-spacing:.03em;color:rgba(245,245,247,.58);white-space:nowrap}
.gf-key{position:absolute;right:22px;bottom:22px;z-index:12;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#f5f5f7;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 0 1px rgba(255,255,255,.1),0 10px 18px -8px rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .35s var(--gf-spring),opacity .6s var(--gf-ease) .7s,scale .7s var(--gf-spring) .7s}
.gf-key:hover{transform:translateY(-2px)}.gf-key:active{transform:scale(.93)}
.gf-key svg{width:30px;height:12px;fill:none;stroke:currentColor;stroke-width:1.7}
.gf-menu{position:absolute;right:22px;bottom:90px;z-index:20;min-width:200px;padding:6px;border-radius:16px;display:flex;flex-direction:column;background:rgba(30,30,34,.72);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 .5px rgba(255,255,255,.1),0 24px 48px -16px rgba(0,0,0,.8);transform-origin:100% 100%;opacity:0;visibility:hidden;transform:translateY(6px) scale(.94);transition:opacity .2s var(--gf-ease),transform .32s var(--gf-spring),visibility 0s .32s}
.gf-menu[data-open]{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.gf-mi{padding:9px 12px;border-radius:10px;font-size:13.5px;text-align:left;color:#f4f4f5}
.gf-mi:hover,.gf-mi:focus-visible{background:rgba(255,255,255,.09)}
.gf-mi.danger{color:#ff6b5e}
.mm{position:absolute;bottom:auto;z-index:60}
.gf:not([data-entered]) .gf-back,.gf:not([data-entered]) .gf-rim.b{translate:0 22px;opacity:0}
.gf:not([data-entered]) .gf-sheet{translate:0 -120px;opacity:0}
.gf:not([data-entered]) .gf-front{translate:0 46px;opacity:0}
.gf:not([data-entered]) .gf-key{opacity:0;scale:.6}
.gf:not([data-entered]) .gf-shadow{opacity:0}
.gf[data-entered] .gf-sheet{transition-delay:calc(var(--gf-depth)*40ms),0s,calc(.18s + var(--gf-depth)*90ms),calc(.18s + var(--gf-depth)*90ms)}
.gf[data-entered] .gf-front{transition-delay:0s,.42s,.42s}
.fhint{font:11px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

@media (max-width:860px){
  :root{--sbw:0px}
  .side{transform:translateX(-110%);opacity:0;width:228px}
  .side.open{transform:none;opacity:1}
  #sbtoggle{display:grid}
  .bar{left:14px}
  .pad{padding-left:20px;padding-right:20px}
  .rail{padding-left:20px;scroll-padding-left:20px}
  .rnav{display:none}
  .hinfo,.dinfo{left:20px;right:20px;bottom:46px}
  .dots{right:20px;bottom:18px}
  .pc{flex-basis:122px}.cc{flex-basis:240px}
  .crow .t{display:none}
}

/* ---------- dil ---------- */
html[data-l=en] .l-tr{display:none!important}
html:not([data-l=en]) .l-en{display:none!important}
.sfoot{display:flex;align-items:center;gap:4px}
.sfoot .nav{flex:1;min-width:0}
.mini{display:inline-flex;padding:2px;border-radius:999px;background:rgba(255,255,255,.07);flex:none;margin-right:4px}
.mini button{font-size:10px;font-weight:700;padding:4px 7px;border-radius:999px;color:var(--ink-3);transition:background .2s,color .2s}
.mini button.on{background:rgba(255,255,255,.18);color:#fff}
/* disk kartı: tıklayınca kütüphane özetine büyür */
.disk{cursor:pointer;text-align:left;transition:background .3s}
.disk:hover{background:rgba(255,255,255,.08)}
.disk > span{display:block}
.dstats{display:grid!important;grid-template-rows:0fr;transition:grid-template-rows .45s var(--spring)}
.disk.open .dstats{grid-template-rows:1fr}
.dstats > span{overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:0}
.dnum{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-top:6px}
.dnum span{display:flex;flex-direction:column;padding:7px 8px;border-radius:9px;background:rgba(255,255,255,.05)}
.dnum b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.dgen{display:flex;flex-wrap:wrap;gap:4px}
.dgen i{font-style:normal;font-size:10px;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--ink-2)}
/* vitrin okları, ortadaki noktalar, başrol */
.harr{position:absolute;z-index:2;top:44%;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;opacity:0;transition:opacity .25s,transform .2s var(--spring)}
.hero:hover .harr{opacity:1}
.harr:active{transform:scale(.92)}
.harr.l{left:calc(var(--sbw) + 22px)}.harr.r{right:18px}
.dots{left:50%!important;right:auto!important;bottom:22px!important;transform:translateX(-50%);padding-left:var(--sbw)}
.starring{font-size:12px;color:var(--ink-3)}.starring b{color:var(--ink-2);font-weight:500}
.newb{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:#fff;color:#000}
.play.wide{padding:0 36px 0 30px}
/* puanlar */
.ratings{display:flex;flex-wrap:wrap;gap:8px}
.rt{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.09);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.rt i{font-style:normal;font-size:9px;font-weight:800;padding:2px 4px;border-radius:4px}
.rt .imdb{background:#f5c518;color:#000}.rt .rtm{background:#fa320a;color:#fff}
/* türler */
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding-top:22px;padding-bottom:40px}
.gtile{position:relative;height:112px;border-radius:18px;overflow:hidden;text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12);transition:transform .4s var(--spring)}
.gtile:hover{transform:translateY(-3px)}
.gtile b{font-size:17px;font-weight:700}.gtile small{font-size:12px;color:var(--ink-2)}
/* oynatıcı çubuğu: uygulamadaki düzen */
.srow2{display:flex;align-items:center;gap:12px}
.srow2 .t{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:48px}
.srow2 .t.r{text-align:right}
.srow2 .scrub{flex:1}
.crow .lft,.crow .rgt{display:flex;gap:2px;flex:1}
.crow .rgt{justify-content:flex-end}
.crow .mid{flex:none!important}
.sub.contour span{font-weight:700;text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000,0 2px 6px rgba(0,0,0,.8)}
.sub.yellow span{color:#ffe65a;text-shadow:0 0 3px #000,0 2px 8px rgba(0,0,0,.9)}
.findrow{display:flex;align-items:center;gap:10px;margin:4px 4px 6px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.08);font-size:12px}
.findrow b{font-weight:600}.findrow .fetch{margin-left:auto;height:26px;padding:0 12px}
/* açılış: söz ve devam satırı */
.iquote{margin:96px 0 0;max-width:600px;text-align:center;opacity:0;padding:0 16px}
.iquote q{display:block;font:italic 400 clamp(16px,2vw,21px)/1.45 Georgia,"New York","Times New Roman",serif;color:rgba(255,255,255,.9)}
.iquote small{display:block;margin-top:10px;font:italic 500 13px Georgia,"Times New Roman",serif;color:rgba(255,255,255,.55);letter-spacing:.04em}
.iprompt{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:rgba(255,255,255,.62);white-space:nowrap;opacity:0}
.iprompt kbd{font:600 11px var(--f-ui);padding:3px 7px;border-radius:5px;border:1px solid rgba(255,255,255,.4)}
@keyframes ipulse{0%,100%{opacity:.5}50%{opacity:1}}
.iprompt.on{animation:ipulse 2.8s ease-in-out infinite}
@media (max-width:520px){.srow2 .t{display:none}}
/* tek renkli ayar simgeleri */
.gr .sq{background:rgba(255,255,255,.1)!important;color:var(--ink)}
.gr .mini{margin-left:auto;margin-right:0}
/* anlatım bölümü */
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.feat div{padding:16px;border-radius:18px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 .5px var(--hair);display:flex;flex-direction:column;gap:6px;min-width:0}
.feat b{font-size:15px;letter-spacing:-.01em}.feat p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;counter-reset:st}
.flow div{position:relative;padding:14px 14px 14px 46px;border-radius:16px;background:rgba(255,255,255,.04);font-size:13px;line-height:1.45;color:var(--ink-2);min-width:0}
.flow div::before{counter-increment:st;content:counter(st);position:absolute;left:14px;top:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);color:#fff}
.flow b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}

/* ---------- sistem penceresi: macOS · Windows · Linux (GNOME) ---------- */
.win[data-os=windows]{--win-r:8px}
.win[data-os=linux]{--win-r:12px}
.win:not([data-os=macos]) .lights{display:none}
.win:not([data-os=macos]) .side{padding-top:12px}
.caption{display:none;position:absolute;z-index:60;top:0;right:0;align-items:center}
.caption button{display:grid;place-items:center;color:var(--ink-2)}
.caption svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.1}
.win[data-os=windows] .caption{display:flex}
.win[data-os=windows] .caption button{width:46px;height:32px;transition:background .15s}
.win[data-os=windows] .caption button:hover{background:rgba(255,255,255,.08);color:#fff}
.win[data-os=windows] .caption button.x:hover{background:#c42b1c}
.win[data-os=linux] .caption{display:flex;gap:12px;top:14px;right:16px}
.win[data-os=linux] .caption button{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.1);transition:background .15s}
.win[data-os=linux] .caption button:hover{background:rgba(255,255,255,.18)}
.win[data-os=linux] .caption svg{stroke-width:1.6;width:9px;height:9px}
.win[data-os=windows] .bar{right:150px}

function reset(){closeMore();closeSettings();$$('.dim').forEach(function(x){x.remove()});closePlayer(true);var it=$('.intro');if(it)it.remove();
  $$('.gf[data-open]').forEach(function(o){gfOpen(o,false)});$('#side').classList.remove('open');$$('.nav.fb').forEach(function(n){n.classList.remove('ping')})}
var CH={
  acilis:function(){show('home',{noAnim:true});playIntro()},
  vitrin:function(){show('home')},
  kutuphane:function(){state.query='';$('#q').value='';state.gmode='movies';state.filter='all';show('grid')},
  film:function(){openDetail('dune-part-two',null)},
  oynatici:function(){openPlayer('dune-part-two')},
  altyazi:function(auto){F.interstellar.tr='none';openPlayer('interstellar');setTimeout(function(){if(!P)return;var b=$('[data-p=sub]',P.el);if(b)openPop('sub',b);
    if(auto)setTimeout(function(){var x=P&&$('[data-find]',P.el);if(x)x.click()},1400)},650)},
  dosyalar:function(){show('files');setTimeout(function(){var g=$$('.gf')[0];if(g&&state.view==='files')gfOpen(g,true)},1300)},
  duzen:function(auto){show('files',{noAnim:true});setTimeout(function(){openCleanup(auto)},250)},
  ayarlar:function(auto){openSettings();setTimeout(function(){var sb=$('.sheet');if(sb)sb.scrollTo({top:sb.scrollHeight,behavior:RM?'auto':'smooth'});if(auto)setTimeout(checkUpdates,700)},500)},
  geribildirim:function(){show('home');var n=$('.nav.fb');if(n)n.classList.add('ping');setTimeout(openFeedback,1100)}
};
addEventListener('message',function(e){if(e.origin!==location.origin||!e.data||!e.data.perdeTour)return;var m=e.data;
  if(m.os){win.dataset.os=m.os;requestAnimationFrame(function(){lgApply(true)})}
  if(m.chapter&&CH[m.chapter]){reset();CH[m.chapter](!!m.auto)}});
['pointerdown','keydown','wheel'].forEach(function(t){addEventListener(t,function(e){if(e.isTrusted)post({interact:1})},{passive:true,capture:true})});

/* ---------- boot ---------- */
window.__perdeLang=function(){if($('.dim'))openSettings()};
setLang(LANG,true);
show('home',{noAnim:true});
post({ready:1});
})();
